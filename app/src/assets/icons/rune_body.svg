<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="runeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="60%" stop-color="#d4a234" />
      <stop offset="100%" stop-color="#6e4610" />
    </linearGradient>
    <filter id="felGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Diamond Base Frame -->
  <polygon points="32,4 58,32 32,60 6,32" fill="#14091e" stroke="url(#runeGold)" stroke-width="2.5" />
  <polygon points="32,10 52,32 32,54 12,32" fill="#1e102d" stroke="rgba(200, 164, 93, 0.4)" stroke-width="1" />
  <!-- Shadow Flesh / Demonic Skull Rune -->
  <g fill="#48ff48" stroke="#39ff14" stroke-width="1" filter="url(#felGlow)">
    <!-- Cranium -->
    <path d="M22 26 C22 18 42 18 42 26 C42 32 38 34 38 38 L26 38 C26 34 22 32 22 26 Z" />
    <!-- Eye Sockets (Dark Cutouts) -->
    <ellipse cx="27" cy="27" rx="3" ry="4" fill="#14091e" stroke="none" />
    <ellipse cx="37" cy="27" rx="3" ry="4" fill="#14091e" stroke="none" />
    <!-- Nasal Cavity -->
    <polygon points="32,31 30,35 34,35" fill="#14091e" stroke="none" />
    <!-- Teeth -->
    <rect x="28" y="40" width="2" height="4" rx="0.5" />
    <rect x="31" y="40" width="2" height="4" rx="0.5" />
    <rect x="34" y="40" width="2" height="4" rx="0.5" />
  </g>
</svg>
