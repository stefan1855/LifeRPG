<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="runeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="60%" stop-color="#d4a234" />
      <stop offset="100%" stop-color="#6e4610" />
    </linearGradient>
    <filter id="felGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Diamond Base Frame -->
  <polygon points="32,4 58,32 32,60 6,32" fill="#14091e" stroke="url(#runeGold)" stroke-width="2.5" />
  <polygon points="32,10 52,32 32,54 12,32" fill="#1e102d" stroke="rgba(200, 164, 93, 0.4)" stroke-width="1" />
  <!-- Fel Creation / Alchemical Flask & Potion Rune -->
  <g fill="none" stroke="#48ff48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#felGlow)">
    <!-- Flask Neck & Rim -->
    <path d="M28 20 L36 20 M30 20 L30 28 L20 44 C18 47 22 50 26 50 L38 50 C42 50 46 47 44 44 L34 28 L34 20" />
    <!-- Liquid Surface inside Flask -->
    <path d="M24 38 Q32 34 40 38 L38 48 L26 48 Z" fill="#48ff48" fill-opacity="0.8" />
    <!-- Bubbling Fel Magic Orbs -->
    <circle cx="28" cy="42" r="1.5" fill="#ffffff" stroke="none" />
    <circle cx="34" cy="40" r="2" fill="#ffffff" stroke="none" />
    <circle cx="32" cy="24" r="1.5" fill="#39ff14" stroke="none" />
  </g>
</svg>
