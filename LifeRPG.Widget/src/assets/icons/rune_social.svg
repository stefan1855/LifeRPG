<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="runeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="60%" stop-color="#d4a234" />
      <stop offset="100%" stop-color="#6e4610" />
    </linearGradient>
    <filter id="felGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Diamond Base Frame -->
  <polygon points="32,4 58,32 32,60 6,32" fill="#14091e" stroke="url(#runeGold)" stroke-width="2.5" />
  <polygon points="32,10 52,32 32,54 12,32" fill="#1e102d" stroke="rgba(200, 164, 93, 0.4)" stroke-width="1" />
  <!-- Whisper Tongue / 4-Point Sharp Astral Star Rune -->
  <g fill="#48ff48" stroke="#39ff14" stroke-width="1" filter="url(#felGlow)">
    <!-- 4-point Star -->
    <path d="M32 16 Q32 32 48 32 Q32 32 32 48 Q32 32 16 32 Q32 32 32 16 Z" />
    <!-- Secondary Diagonal Small Star -->
    <path d="M32 23 Q32 32 41 32 Q32 32 32 41 Q32 32 23 32 Q32 32 32 23 Z" fill="#ffffff" />
    <!-- Core Spark -->
    <circle cx="32" cy="32" r="2" fill="#ffffff" stroke="none" />
  </g>
</svg>
