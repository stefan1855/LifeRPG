<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="runeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="60%" stop-color="#d4a234" />
      <stop offset="100%" stop-color="#6e4610" />
    </linearGradient>
    <filter id="felGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Diamond Base Frame -->
  <polygon points="32,4 58,32 32,60 6,32" fill="#14091e" stroke="url(#runeGold)" stroke-width="2.5" />
  <polygon points="32,10 52,32 32,54 12,32" fill="#1e102d" stroke="rgba(200, 164, 93, 0.4)" stroke-width="1" />
  <!-- Soul Shard / Faceted Crystal Gemstone Rune -->
  <g fill="#48ff48" stroke="#39ff14" stroke-width="1.8" stroke-linejoin="round" filter="url(#felGlow)">
    <!-- Gem Top Crown -->
    <polygon points="26,22 38,22 44,28 20,28" fill="#68ff68" />
    <!-- Gem Lower Pavilion -->
    <polygon points="20,28 44,28 32,48" fill="#39ff14" />
    <!-- Internal Facet Lines -->
    <polygon points="26,28 38,28 32,48" fill="#1fc600" />
    <line x1="26" y1="22" x2="26" y2="28" stroke="#ffffff" stroke-width="1" />
    <line x1="38" y1="22" x2="38" y2="28" stroke="#ffffff" stroke-width="1" />
    <line x1="32" y1="22" x2="32" y2="28" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
